<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="800" height="560" fill="#0b0c0e"/>
  <rect x="16" y="16" width="768" height="500" rx="10" fill="#17171c" stroke="#2a2b31"/>
  <circle cx="38" cy="38" r="5" fill="#e0708a"/>
  <circle cx="56" cy="38" r="5" fill="#d9a94a"/>
  <circle cx="74" cy="38" r="5" fill="#4caf7d"/>
  <rect x="100" y="28" width="500" height="20" rx="6" fill="#0f1013"/>
  <text x="112" y="42" fill="#7d838c" font-size="11">console.cloud.google.com/apis/credentials</text>

  <text x="190" y="90" fill="#ececef" font-size="20" font-weight="bold">사용자 인증 정보</text>

  <rect x="500" y="80" width="250" height="36" rx="8" fill="#4c8cff"/>
  <text x="512" y="103" fill="#ffffff" font-size="12" font-weight="bold">+ 사용자 인증 정보 만들기</text>
  <circle cx="625" cy="70" r="16" fill="#4c8cff"/>
  <text x="619" y="75" fill="#ffffff" font-size="14" font-weight="bold">1</text>
  <rect x="493" y="74" width="264" height="50" rx="10" fill="none" stroke="#4c8cff" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="190" y="150" fill="#c7cbd1" font-size="12">→ "OAuth 클라이언트 ID" 선택 → 애플리케이션 유형: 웹 애플리케이션</text>

  <rect x="190" y="190" width="556" height="120" rx="8" fill="#1d2024" stroke="#2a2b31"/>
  <text x="204" y="214" fill="#ececef" font-size="12" font-weight="bold">승인된 리디렉션 URI</text>
  <rect x="204" y="226" width="380" height="30" rx="6" fill="#0f1013" stroke="#4c8cff" stroke-width="2"/>
  <text x="212" y="246" fill="#c7cbd1" font-size="11">https://my-studio.vercel.app/api/auth/google/callback</text>
  <circle cx="610" cy="241" r="14" fill="#4c8cff"/>
  <text x="605" y="246" fill="#fff" font-size="12" font-weight="bold">2</text>
  <text x="204" y="282" fill="#9ba1aa" font-size="11">배포 전이면 http://localhost:3000/api/auth/google/callback 로 우선 생성 가능</text>

  <text x="190" y="350" fill="#c7cbd1" font-size="12">→ "만들기" 클릭 → 발급된 클라이언트 ID/보안 비밀번호를</text>
  <text x="190" y="372" fill="#c7cbd1" font-size="12">GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET 에 저장</text>

  <text x="16" y="545" fill="#8fb6ff" font-size="14" font-weight="bold">⑦ 구글 클라우드 — OAuth 클라이언트 ID 만들기 (🖥️ 컴퓨터 권장)</text>
</svg>
