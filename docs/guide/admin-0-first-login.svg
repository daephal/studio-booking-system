<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="800" height="560" fill="#0b0c0e"/>
  <rect x="16" y="16" width="768" height="500" rx="10" fill="#0b0c0e" stroke="#2a2b31"/>
  <circle cx="38" cy="38" r="5" fill="#e0708a"/>
  <circle cx="56" cy="38" r="5" fill="#d9a94a"/>
  <circle cx="74" cy="38" r="5" fill="#4caf7d"/>
  <rect x="100" y="28" width="500" height="20" rx="6" fill="#111214"/>
  <text x="112" y="42" fill="#7d838c" font-size="11">my-studio.vercel.app/admin/login</text>

  <text x="250" y="140" fill="#ededf0" font-size="19" font-weight="bold">내 스튜디오 관리자 계정 만들기</text>
  <text x="250" y="166" fill="#9ba1aa" font-size="12">처음 배포하셨네요. 앞으로 로그인에 사용할</text>
  <text x="250" y="184" fill="#9ba1aa" font-size="12">이메일과 비밀번호를 정해주세요.</text>

  <rect x="250" y="206" width="300" height="34" rx="8" fill="#1d2024" stroke="#3a3d43"/>
  <text x="262" y="228" fill="#565b62" font-size="12">이메일</text>

  <rect x="250" y="248" width="300" height="34" rx="8" fill="#1d2024" stroke="#3a3d43"/>
  <text x="262" y="270" fill="#565b62" font-size="12">비밀번호 (8자 이상)</text>

  <rect x="250" y="290" width="300" height="34" rx="8" fill="#1d2024" stroke="#3a3d43"/>
  <text x="262" y="312" fill="#565b62" font-size="12">비밀번호 확인</text>

  <rect x="250" y="336" width="300" height="36" rx="10" fill="#4c8cff"/>
  <text x="322" y="359" fill="#ffffff" font-size="13" font-weight="bold">계정 만들고 시작하기</text>
  <circle cx="380" cy="328" r="15" fill="#4c8cff"/>
  <text x="374" y="333" fill="#fff" font-size="13" font-weight="bold">1</text>
  <rect x="244" y="200" width="312" height="178" rx="12" fill="none" stroke="#4c8cff" stroke-width="2" stroke-dasharray="4 3"/>

  <text x="190" y="420" fill="#c7cbd1" font-size="12">→ 배포 후 이 주소에 처음 접속하면 자동으로 뜨는 화면입니다.</text>
  <text x="190" y="440" fill="#c7cbd1" font-size="12">여기서 만든 이메일/비밀번호가 앞으로의 로그인 정보이며, 최초 1회만 나타납니다.</text>

  <text x="16" y="545" fill="#8fb6ff" font-size="14" font-weight="bold">① 배포 완료 후 /admin/login 접속 → 관리자 계정 만들기</text>
</svg>
